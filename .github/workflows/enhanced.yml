name: Build re3 Enhanced

on:
  workflow_dispatch:
    inputs:
      renderer:
        description: Renderer to build
        type: choice
        options: [opengl, d3d9, all]
        default: opengl
  push:
    branches: [enhanced-source]

permissions:
  contents: read

concurrency:
  group: re3-enhanced
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.renderer == 'opengl' && '[{"platform":"win-amd64-librw_gl3_glfw-oal","artifact":"re3-enhanced-x64-exe-pdb"}]' || inputs.renderer == 'd3d9' && '[{"platform":"win-amd64-librw_d3d9-oal","artifact":"re3-enhanced-x64-d3d9-exe-pdb"}]' || '[{"platform":"win-amd64-librw_gl3_glfw-oal","artifact":"re3-enhanced-x64-exe-pdb"},{"platform":"win-amd64-librw_d3d9-oal","artifact":"re3-enhanced-x64-d3d9-exe-pdb"}]') }}
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Get Hezkore source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download GLFW
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/glfw/glfw/releases/download/3.3.2/glfw-3.3.2.bin.WIN64.zip' -OutFile glfw.zip
          Expand-Archive -LiteralPath glfw.zip -DestinationPath .

      - name: Test windscreen geometry and smooth zoom
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /EHsc /W4 /WX /std:c++14 tests/enhanced_math.cpp /Fe:enhanced_math_test.exe
          if errorlevel 1 exit /b 1
          enhanced_math_test.exe
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /W4 /WX /std:c++14 tests/enhanced_route.cpp /Fe:enhanced_route_test.exe
          if errorlevel 1 exit /b 1
          enhanced_route_test.exe
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /W4 /WX /std:c++14 tests/enhanced_script.cpp /Fe:enhanced_script_test.exe
          if errorlevel 1 exit /b 1
          enhanced_script_test.exe
          if errorlevel 1 exit /b 1

      - name: Generate Visual Studio project
        run: |
          & ./premake5.exe vs2019 --with-librw --no-full-paths --glfwdir64=glfw-3.3.2.bin.WIN64
          if ($LASTEXITCODE -ne 0) { throw 'Premake failed' }

      - name: Build matching EXE and full PDB
        run: |
          & msbuild build/re3.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:DebugSymbols=true /p:DebugType=full /p:GenerateDebugInformation=true
          if ($LASTEXITCODE -ne 0) { throw 'MSBuild failed' }

      - name: Prepare package
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDir = 'bin/${{ matrix.platform }}/Release'
          foreach ($fileName in @('re3.exe', 're3.pdb')) {
            $sourceFile = Join-Path $outputDir $fileName
            if (!(Test-Path -LiteralPath $sourceFile)) { throw "Missing build output: $sourceFile" }
            Copy-Item -LiteralPath $sourceFile -Destination gamefiles
          }
          Copy-Item vendor/mpg123/dist/Win64/libmpg123-0.dll gamefiles
          Copy-Item vendor/openal-soft/dist/Win64/OpenAL32.dll gamefiles
          git rev-parse HEAD | Set-Content gamefiles/BUILD-COMMIT.txt
          Get-FileHash gamefiles/re3.exe,gamefiles/re3.pdb | Format-List | Out-String | Set-Content gamefiles/BUILD-SHA256.txt

      - name: Upload game files with matching PDB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: gamefiles/
          if-no-files-found: error
          retention-days: 14
